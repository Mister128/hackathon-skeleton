name: backend life

on:
    push:
        branches: [ main, master ]

    pull_request: 
        branches: [ main, master ]
    

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        
        - name: Use Node.js
          uses: actions/setup-node@v7
          with:
            node-version: '26.x'

        - run: node --version
        - run: npm --version
        - run: npm ci
          working-directory: backend
        - run: npm start
          background: true
          working-directory: backend
        - run: sleep 5s
        - run: curl -f http://127.0.0.1:${{env.PORT}}/health | grep '"ok":true'
          env:
            PORT: 3001