name: backend and frontend life

on:
    push:
        branches: [ main, master ]

    pull_request: 
        branches: [ main, master ]
    

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        
        - name: Use Node.js
          uses: actions/setup-node@v7
          with:
            node-version: '26.x'

        - run: | 
            node --version
            npm --version
        
        - run: npm ci
          working-directory: backend
        
        - name: Start server and check /health contract
          run: |
            SITE="http://127.0.0.1:$PORT/health"

            npm start > server.log 2>&1 & 
            SERVER_PID=$!
            sleep 5s

            curl -sS $SITE | grep -q '"ok":true' 
            
            curl -sS -D - -o /dev/null "$SITE" | grep -qi 'content-type: *application/json'
            
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE")
            if [ "$code" != "200" ]; then
              echo "health returned $code"
              exit 1
            fi
            kill $SERVER_PID
          working-directory: backend
        
        - if: failure()
          run: cat backend/server.log

        env:
          PORT: 8080
 
    frontend:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        
        - name: Use Node.js
          uses: actions/setup-node@v7
          with:
            node-version: '26.x'

        - run: | 
            node --version
            npm --version

        - name: Build
          run: | 
            npm ci
            npm run build
          working-directory: frontend
        
        - name: Upload
          uses: actions/upload-artifact@v6
          with:
            name: frontend-dist
            path: frontend/dist
            if-no-files-found: error
          
        - name: Forbid absolute backend URL in bundle
          run: |
            if grep -Erq 'http://(localhost|127\.0\.0\.1):8080' frontend/dist; then
              echo "ERROR: absolute backend URL in bundle (breaks prod + needs CORS)"
              grep -Erno 'http://(localhost|127\.0\.0\.1):8080' frontend/dist
              exit 1
            fi
            echo "PASS: No absolute localhost address."

