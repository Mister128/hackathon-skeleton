name: backend and frontend life

on:
    push:
        branches: [ main, master ]

    pull_request: 
        branches: [ main, master ]
    

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        
        - name: Use Node.js
          uses: actions/setup-node@v7
          with:
            node-version: '26.x'

        - run: | 
            node --version
            npm --version
        
        - run: npm ci
          working-directory: backend
        
        - run: |
            npm start > server.log 2>&1 & 
            SERVER_PID=$!
            sleep 5s
            curl -f http://127.0.0.1:$PORT/health | grep '"ok":true'
            kill $SERVER_PID
          working-directory: backend
        
        - if: failure()
          run: cat backend/server.log

        env:
          PORT: 8080
 
    frontend:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        
        - name: Use Node.js
          uses: actions/setup-node@v7
          with:
            node-version: '26.x'

        - run: | 
            node --version
            npm --version

        - run: | 
            npm ci
            npm run build
          working-directory: frontend
        
        - name: Upload
          uses: actions/upload-artifact@v6
          with:
            name: frontend-dist
            path: frontend/dist
            if-no-files-found: error
