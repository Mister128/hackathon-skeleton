x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose: ["${BACKEND_PORT}"]
    environment:
      - PORT=${BACKEND_PORT}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BACKEND_PORT}/health"]
      <<: *healthcheck

  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["8081:80"]   # отладка с хоста; на VPS убрать/поменять на 80:80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health"]
      <<: *healthcheck
    depends_on:
      backend:
        condition: service_healthy

  tunnel:
    image: cloudpub/cloudpub:latest
    restart: unless-stopped
    command: run
    environment:
      - TOKEN=${CLOUDPUB_TOKEN}
      - HTTP=web:80
    depends_on:
      web:
        condition: service_healthy